<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>X Follower Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>X Follower Tracker</h1>
    <p class="status" id="status">準備中...</p>
    
    <div class="stats">
      <div>保存中: <strong id="savedCount">0</strong>人</div>
      <div>新規: <strong id="newCount">0</strong></div>
      <div>解除: <strong id="lostCount">0</strong></div>
      <div>最終更新: <span id="lastUpdate">-</span></div>
    </div>

    <div class="progress" id="progress" style="display:none;">
      <div class="bar" id="progressBar"></div>
      <span id="progressText">0%</span>
    </div>

    <div class="buttons">
      <button id="btnFullScan">フルスキャン開始（数万人対応）</button>
      <button id="btnQuick">クイック（最新のみ）</button>
      <button id="btnStop">停止</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="new">新規</button>
      <button class="tab" data-tab="lost">解除</button>
    </div>
    <ul id="userList" class="user-list"></ul>

    <div class="footer">
      <button id="btnExport">JSONエクスポート</button>
      <button id="btnClear">データ削除</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
